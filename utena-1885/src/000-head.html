<title>Utena, 1885</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An alternate history: Revolutionary Girl Utena published as a pseudonymous Tokyo newspaper serial in 1885–87, and the Japan and world it made, 1885–2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Shippori+Mincho+B1:wght@400;600;800&display=swap">
<style>
/* Layout: a reading column beside a sticky contents rail, set like a Meiji serial's
   collected edition: Tsukiji-type mincho for Japanese, a Didone for display, a news face for text,
   aniline crimson and aniline violet as the two inks of 1880s prints, rose-cornered frames for exhibits. */
:root {
  --paper: #f2eff3;
  --paper-2: #e8e2e8;
  --paper-3: #ddd5dd;
  --ink: #1e1922;
  --ink-2: #4b4352;
  --ink-3: #6f6676;
  --rule: #cbc1cc;
  --red: #b3132e;
  --red-soft: #f3d9de;
  --violet: #57297f;
  --violet-soft: #e6dcef;
  --rose: #c95a8a;
  --green: #2b6657;
  --green-soft: #d8e9e3;
  --gold: #8a6a1f;
  --kage-bg: #9c1129;
  --kage-fg: #fff7f9;
  --shadow: 0 1px 0 rgba(30, 25, 34, .06), 0 8px 24px -16px rgba(30, 25, 34, .35);

  --display: "Bodoni Moda", "Bodoni 72", Didot, "Big Caslon", Georgia, serif;
  --body: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;

  --step--1: .875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.15rem;
  --step-4: 3rem;
  --measure: 40rem;
  --s-ours: #5b3a9e;
  --s-alt: #c4193a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16121a; --paper-2: #1f1925; --paper-3: #2a2231;
    --ink: #ede6ef; --ink-2: #c3b9c7; --ink-3: #9a90a0; --rule: #3a3141;
    --red: #f26b80; --red-soft: #3a1820; --violet: #bd98e8; --violet-soft: #2c2140;
    --rose: #f0a3c4; --green: #7cc5b1; --green-soft: #17312b; --gold: #d8b45a; --kage-bg: #6e1022; --kage-fg: #ffeef2; --s-ours: #9d7fe0; --s-alt: #e8566e;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16121a; --paper-2: #1f1925; --paper-3: #2a2231;
  --ink: #ede6ef; --ink-2: #c3b9c7; --ink-3: #9a90a0; --rule: #3a3141;
  --red: #f26b80; --red-soft: #3a1820; --violet: #bd98e8; --violet-soft: #2c2140;
  --rose: #f0a3c4; --green: #7cc5b1; --green-soft: #17312b; --gold: #d8b45a; --kage-bg: #6e1022; --kage-fg: #ffeef2; --s-ours: #9d7fe0; --s-alt: #e8566e;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.62;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--violet-soft); color: var(--ink); }
a { color: var(--violet); text-decoration-thickness: 1px; text-underline-offset: .18em; }
a:hover { color: var(--red); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 2px; }
[lang="ja"], .jp { font-family: var(--jp); }
ruby rt { font-size: .5em; letter-spacing: .02em; }

.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- masthead ---------- */
.mast { border-bottom: 1px solid var(--rule); background: var(--paper); }
.mast-inner {
  max-width: 72rem; margin: 0 auto; padding-block: 2.5rem 2rem;
  display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 300px); gap: 2.5rem; align-items: center;
}
.mast-tate {
  writing-mode: vertical-rl; font-family: var(--jp); font-weight: 800;
  font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; letter-spacing: .08em; color: var(--ink);
  border-left: 2px solid var(--red); border-right: 2px solid var(--red); padding: .6rem .5rem;
  display: flex; gap: .4rem; align-items: center;
}
.mast-tate rt { font-weight: 600; font-size: .3em; color: var(--red); }
.mast-tate .by { font-size: .32em; font-weight: 600; color: var(--ink-2); letter-spacing: .25em; margin-top: .4rem; }
.mast-copy { min-width: 0; }
.eyebrow { font-family: var(--body); font-variant: all-small-caps; letter-spacing: .12em; font-size: var(--step-0); color: var(--red); margin: 0 0 .4rem; }
.mast h1 {
  font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.02;
  margin: 0 0 .7rem; letter-spacing: -.01em; text-wrap: balance;
}
.mast h1 em { font-style: italic; font-weight: 500; color: var(--violet); }
.mast .dek { font-size: var(--step-1); line-height: 1.45; color: var(--ink-2); max-width: 36rem; margin: 0 0 1rem; text-wrap: pretty; }
.mast .meta { font-size: var(--step--1); color: var(--ink-3); margin: 0; }
.mast-art { width: 100%; max-width: 300px; justify-self: end; }
.mast-art svg { width: 100%; height: auto; display: block; }

/* ---------- layout ---------- */
.page {
  max-width: 72rem; margin: 0 auto; padding-block: 2.5rem 5rem;
  display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 3.25rem; align-items: start;
}
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1.25rem); max-height: calc(100vh - 2.5rem); overflow-y: auto; padding-right: .25rem; font-size: .9rem; }
.rail h2 { font-family: var(--body); font-variant: all-small-caps; letter-spacing: .12em; font-size: .95rem; color: var(--ink-3); margin: 0 0 .5rem; font-weight: 600; }
.rail ol { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: .1rem; counter-reset: toc; }
.rail li a { display: grid; grid-template-columns: 2.1rem 1fr; gap: .2rem; padding: .22rem .3rem; border-radius: 3px; color: var(--ink-2); text-decoration: none; line-height: 1.3; }
.rail li a .n { font-family: var(--display); color: var(--ink-3); font-variant-numeric: lining-nums; }
.rail li a:hover { background: var(--paper-2); color: var(--ink); }
.rail li a.on { background: var(--paper-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--red); }
.legend { border-top: 1px solid var(--rule); padding-top: 1rem; display: grid; gap: .5rem; }
.legend p { margin: 0; color: var(--ink-3); font-size: .85rem; line-height: 1.4; }
.legend .btns { display: flex; flex-wrap: wrap; gap: .35rem; }
.legend button {
  font: inherit; font-size: .8rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2);
  border-radius: 999px; padding: .15rem .6rem; cursor: pointer;
}
.legend button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.toc-mobile { display: none; }

main { min-width: 0; }
section.chap { border-top: 1px solid var(--rule); padding-top: 2.4rem; margin-top: 3rem; }
section.chap:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.chap-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem; align-items: baseline; margin-bottom: 1.2rem; }
.chap-num { font-family: var(--display); font-size: var(--step-3); color: var(--red); line-height: 1; font-variant-numeric: lining-nums; }
.chap-head h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-3); line-height: 1.08; margin: 0; text-wrap: balance; }
.chap-head .sub { grid-column: 2; margin: .35rem 0 0; color: var(--ink-3); font-size: var(--step-0); font-style: italic; }
main h3 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.15; margin: 2.4rem 0 .7rem; text-wrap: balance; }
main h4 { font-family: var(--body); font-weight: 650; font-size: var(--step-1); margin: 1.8rem 0 .5rem; }
.prose > p, .prose > ul, .prose > ol, .prose > blockquote, .prose > h3, .prose > h4, .prose > dl, .prose > .note { max-width: var(--measure); }
.prose p { margin: 0 0 1.05em; text-wrap: pretty; hyphens: auto; }
.prose ul, .prose ol { padding-left: 1.3rem; margin: 0 0 1.1em; }
.prose li { margin: .25em 0; }
.prose li::marker { color: var(--red); }
.lead { font-size: var(--step-1); line-height: 1.5; color: var(--ink); }
.small { font-size: var(--step--1); color: var(--ink-2); }
strong { font-weight: 650; }
blockquote { margin: 1.4rem 0; padding: .2rem 0 .2rem 1.1rem; border-left: 2px solid var(--violet); color: var(--ink-2); font-style: italic; }

/* year headings inside chronicles */
.yr { display: flex; align-items: baseline; gap: .8rem; margin: 2.2rem 0 .6rem; max-width: var(--measure); }
.yr b { font-family: var(--display); font-size: var(--step-2); color: var(--ink); font-weight: 600; font-variant-numeric: lining-nums; }
.yr span { color: var(--ink-3); font-variant: all-small-caps; letter-spacing: .1em; font-size: var(--step-0); }
.yr::after { content: ""; flex: 1; border-bottom: 1px solid var(--rule); transform: translateY(-.3em); }

/* labels */
.tag {
  display: inline-block; font-family: var(--body); font-variant: all-small-caps; letter-spacing: .08em;
  font-size: .82em; line-height: 1.25; padding: 0 .38em .05em; border-radius: 3px; vertical-align: .06em; white-space: nowrap; font-style: normal;
}
.tag.d { background: var(--green-soft); color: var(--green); }
.tag.i { background: var(--violet-soft); color: var(--violet); }
.tag.c { background: var(--red-soft); color: var(--red); }
body.f-d .prose p:has(.tag.d), body.f-d .prose li:has(.tag.d),
body.f-i .prose p:has(.tag.i), body.f-i .prose li:has(.tag.i),
body.f-c .prose p:has(.tag.c), body.f-c .prose li:has(.tag.c) { background: var(--paper-2); box-shadow: -10px 0 0 var(--paper-2), 10px 0 0 var(--paper-2); border-radius: 2px; }
body.f-d .prose p:not(:has(.tag.d)), body.f-i .prose p:not(:has(.tag.i)), body.f-c .prose p:not(:has(.tag.c)) { opacity: .55; }

/* exhibits: rose-cornered frames */
.frame {
  position: relative; background: var(--paper-2); border: 1px solid var(--rule); padding: 1.4rem 1.5rem 1.2rem;
  margin: 1.8rem 0; max-width: 46rem;
}
.frame::before, .frame::after {
  content: ""; position: absolute; width: 22px; height: 22px; background: var(--red);
  -webkit-mask: radial-gradient(circle at 50% 50%, #000 3px, transparent 3.5px), radial-gradient(circle at 50% 20%, #000 4.5px, transparent 5px), radial-gradient(circle at 80% 50%, #000 4.5px, transparent 5px), radial-gradient(circle at 50% 80%, #000 4.5px, transparent 5px), radial-gradient(circle at 20% 50%, #000 4.5px, transparent 5px);
          mask: radial-gradient(circle at 50% 50%, #000 3px, transparent 3.5px), radial-gradient(circle at 50% 20%, #000 4.5px, transparent 5px), radial-gradient(circle at 80% 50%, #000 4.5px, transparent 5px), radial-gradient(circle at 50% 80%, #000 4.5px, transparent 5px), radial-gradient(circle at 20% 50%, #000 4.5px, transparent 5px);
}
.frame::before { top: -11px; left: -11px; }
.frame::after { bottom: -11px; right: -11px; }
.frame .kicker { font-variant: all-small-caps; letter-spacing: .12em; color: var(--red); margin: 0 0 .5rem; font-size: .95rem; }
.frame h4 { margin-top: 0; font-family: var(--display); font-size: var(--step-1); }
.frame p:last-child { margin-bottom: 0; }
.doc-src { font-size: var(--step--1); color: var(--ink-3); margin-top: .8rem; font-style: italic; }

/* shadow-play interludes */
.kage {
  margin: 2.6rem 0; max-width: 46rem; background: var(--kage-bg); color: var(--kage-fg); border-radius: 2px; position: relative; overflow: hidden;
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 1.2rem; padding: 1.2rem 1.4rem;
}
.kage svg { width: 96px; height: auto; align-self: center; }
.kage .lines { display: grid; gap: .35rem; font-size: var(--step-0); line-height: 1.45; }
.kage .lines p { margin: 0; }
.kage .lines b { font-variant: all-small-caps; letter-spacing: .1em; font-weight: 600; opacity: .85; margin-right: .4em; }
.kage .cap { font-variant: all-small-caps; letter-spacing: .14em; font-size: .85rem; opacity: .85; margin: 0 0 .2rem; }

/* tables */
.tbl { overflow-x: auto; margin: 1.6rem 0 2rem; border: 1px solid var(--rule); background: var(--paper); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; line-height: 1.45; font-variant-numeric: tabular-nums lining-nums; }
th, td { text-align: left; vertical-align: top; padding: .55rem .7rem; border-bottom: 1px solid var(--rule); }
thead th { font-variant: all-small-caps; letter-spacing: .08em; font-weight: 600; color: var(--ink-2); background: var(--paper-2); position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
td .jp, th .jp { font-size: 1.04em; }
.conc td:nth-child(1) { font-family: var(--display); color: var(--red); white-space: nowrap; }
.conc td:nth-child(2) { min-width: 13rem; }
.conc td:nth-child(3) { min-width: 22rem; }
.conc tr.part td { background: var(--paper-2); font-family: var(--body); color: var(--ink); font-weight: 650; }
.conc .ser { display: block; font-family: var(--jp); font-size: 1.12em; color: var(--ink); }
.conc .ro { display: block; font-style: italic; color: var(--ink-3); font-size: .9em; }
.conc .en { display: block; color: var(--ink-2); }
.vs td:nth-child(2) { color: var(--ink-2); }
.vs td:nth-child(3) { color: var(--ink); }

/* figures */
figure { margin: 2rem 0; }
figure svg { max-width: 100%; height: auto; display: block; }
figcaption { font-size: var(--step--1); color: var(--ink-3); margin-top: .6rem; max-width: var(--measure); }
.figwide { overflow-x: auto; }

/* the newspaper mock-up */
.paper-mock {
  background: #f4efe4; color: #1b1712; border: 1px solid #c9bfae; padding: 1.1rem; margin: 2rem 0; max-width: 46rem;
  box-shadow: var(--shadow);
}
.paper-mock .row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 1rem; align-items: stretch; }
.paper-mock .tate-text {
  writing-mode: vertical-rl; font-family: var(--jp); font-size: 15px; line-height: 1.85; letter-spacing: .04em;
  height: 30rem; overflow-x: auto; overflow-y: hidden; border-left: 1px solid #c9bfae; border-right: 1px solid #c9bfae; padding: .6rem .4rem;
}
.paper-mock .tate-text h5 { font-size: 18px; font-weight: 800; margin: 0 0 0 .8em; letter-spacing: .1em; }
.paper-mock .tate-text .byl { color: #6a5f50; margin-left: .8em; font-size: 13px; }
.paper-mock .tate-text p { margin: 0 0 0 .3em; text-indent: 1em; }
.paper-mock .tate-text rt { font-size: 7px; }
.paper-mock .cut { border: 1px solid #c9bfae; background: #efe8da; display: flex; align-items: center; justify-content: center; }
.paper-mock .cut svg { width: 100%; height: auto; }
.paper-mock .foot { font-family: var(--body); font-size: .8rem; color: #6a5f50; margin-top: .6rem; }

/* side-by-side cards */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0; max-width: 46rem; }
.pair > div { border: 1px solid var(--rule); padding: .9rem 1rem; background: var(--paper); }
.pair h5 { margin: 0 0 .4rem; font-variant: all-small-caps; letter-spacing: .1em; font-size: .95rem; color: var(--ink-3); font-weight: 600; }
.pair p { margin: 0; font-size: .97rem; }
.pair .ours h5 { color: var(--green); }
.pair .theirs h5 { color: var(--red); }

.note { border-left: 2px solid var(--gold); padding: .2rem 0 .2rem 1rem; color: var(--ink-2); font-size: .96rem; margin: 1.2rem 0; }

dl.gl { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr); gap: .5rem 1.2rem; margin: 1.2rem 0; }
dl.gl dt { font-weight: 650; }
dl.gl dt .jp { font-weight: 600; }
dl.gl dd { margin: 0; color: var(--ink-2); }

.sources { font-size: .95rem; }
.sources li { margin: .35rem 0; }
.backtop { display: inline-block; margin-top: 1rem; font-size: var(--step--1); color: var(--ink-3); }

/* gap chart: same milestone, two timelines */
.gap { margin: 1.6rem 0 2rem; border: 1px solid var(--rule); background: var(--paper); padding: 1rem 1rem .6rem; }
.gap-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; font-size: var(--step--1); color: var(--ink-2); margin-bottom: .8rem; }
.gap-legend span { display: inline-flex; align-items: center; gap: .45rem; }
.gk { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.gk.ours { border: 2.5px solid var(--s-ours); background: var(--paper); }
.gk.alt { background: var(--s-alt); }
.gap-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: .3rem 1rem; align-items: center; padding: .45rem 0; border-top: 1px solid var(--rule); }
.gap-row .lab { font-size: .93rem; line-height: 1.3; color: var(--ink); }
.gap-row .lab small { display: block; color: var(--ink-3); font-size: .82rem; font-variant-numeric: tabular-nums lining-nums; }
.track { position: relative; height: 28px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dotted var(--rule); }
.track .span { position: absolute; top: calc(50% - 1px); height: 2px; background: var(--ink-3); opacity: .7; }
.track .span.open { background: none; border-top: 2px dashed var(--s-ours); height: 0; opacity: 1; }
.dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; cursor: default; outline-offset: 2px; }
.dot::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; }
.dot.ours::after { inset: 3px; border: 2.5px solid var(--s-ours); background: var(--paper); box-shadow: 0 0 0 2px var(--paper); }
.dot.alt::after { inset: 6.5px; background: var(--s-alt); box-shadow: 0 0 0 1.5px var(--paper); }
.dot .tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--paper); font-size: .78rem; padding: .25rem .5rem; border-radius: 3px; z-index: 2; pointer-events: none; }
.dot:hover .tip, .dot:focus .tip { display: block; }
.dot.edge .tip { left: auto; right: 0; transform: none; }
.dot.start .tip { left: 0; transform: none; }
.gap-axis { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 1rem; border-top: 1px solid var(--rule); padding-top: .3rem; }
.gap-axis .ticks { position: relative; height: 1.2rem; font-size: .78rem; color: var(--ink-3); font-variant-numeric: tabular-nums lining-nums; }
.gap-axis .ticks span { position: absolute; transform: translateX(-50%); }
.gap-axis .ticks span:first-child { transform: none; }
.gap-axis .ticks span:last-child { transform: translateX(-100%); }

ul.src { padding-left: 1.1rem; }
ul.src li { margin: .35rem 0; font-size: .96rem; overflow-wrap: anywhere; }
footer.end { border-top: 1px solid var(--rule); margin-top: 4rem; padding-top: 1.5rem; color: var(--ink-3); font-size: var(--step--1); }

@media (max-width: 1020px) {
  .mast-inner { grid-template-columns: auto minmax(0, 1fr); }
  .mast-art { display: none; }
  .page { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail { display: none; }
  .toc-mobile { display: block; margin-bottom: 2rem; border: 1px solid var(--rule); background: var(--paper-2); }
  .toc-mobile summary { padding: .7rem 1rem; cursor: pointer; font-variant: all-small-caps; letter-spacing: .1em; color: var(--ink-2); }
  .toc-mobile ol { margin: 0; padding: 0 1rem 1rem 2.2rem; columns: 2; column-gap: 2rem; }
  .toc-mobile li { break-inside: avoid; margin: .2rem 0; }
}
@media (max-width: 620px) {
  :root { --step-3: 1.75rem; --step-2: 1.38rem; }
  .mast-inner { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; padding-block: 1.6rem 1.4rem; }
  .mast-tate { writing-mode: horizontal-tb; border: 0; border-top: 2px solid var(--red); border-bottom: 2px solid var(--red); justify-self: start; padding: .4rem 0; font-size: 2rem; }
  .toc-mobile ol { columns: 1; }
  .chap-head { grid-template-columns: minmax(0, 1fr); gap: .2rem; }
  .chap-head .sub { grid-column: 1; }
